name: Phase 1 tests

on:
  push:
    branches:
      - feature/nifty-seller-intelligence-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: One-time NSE F&O archive download test
        if: contains(github.event.head_commit.message, '[NSE-DOWNLOAD-SMOKE]')
        shell: bash
        env:
          TRADE_DATE: "20261030"
        run: |
          set -euo pipefail
          DOWNLOAD_DIR="${RUNNER_TEMP}/nse-download-smoke"
          REPORT_NAME="BhavCopy_NSE_FO_0_0_0_${TRADE_DATE}_F_0000.csv.zip"
          REPORT_URL="https://nsearchives.nseindia.com/content/fo/${REPORT_NAME}"
          REPORT_PATH="${DOWNLOAD_DIR}/${REPORT_NAME}"
          mkdir -p "$DOWNLOAD_DIR"
          trap 'rm -rf "$DOWNLOAD_DIR"' EXIT

          echo "Downloading: $REPORT_URL"
          curl --http1.1 --fail --location --show-error --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 120 --output "$REPORT_PATH" "$REPORT_URL"
          test -s "$REPORT_PATH"
          echo "Downloaded bytes: $(wc -c < "$REPORT_PATH")"
          file "$REPORT_PATH"
          unzip -t "$REPORT_PATH"

          python - "$REPORT_PATH" <<'PY'
          import csv
          import io
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              csv_files = [name for name in archive.namelist() if name.lower().endswith(".csv")]
              if not csv_files:
                  raise SystemExit("FAIL: archive contains no CSV")
              print("CSV members:", csv_files)
              with archive.open(csv_files[0]) as raw:
                  reader = csv.reader(io.TextIOWrapper(raw, encoding="utf-8-sig", newline=""))
                  header = next(reader, None)
                  if not header:
                      raise SystemExit("FAIL: empty CSV header")
                  print("Column count:", len(header))
                  print("Header:", " | ".join(header))
                  print("Sample row:", next(reader, None))
          PY

          echo "SHA-256:"
          sha256sum "$REPORT_PATH"

      - name: Run tests
        run: python -m pytest -q
