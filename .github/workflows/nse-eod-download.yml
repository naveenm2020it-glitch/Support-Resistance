name: NSE EOD report download (manual experiment)

on:
  push:
    branches:
      - feature/nifty-seller-intelligence-foundation
  workflow_dispatch:
    inputs:
      session_dates:
        description: "Verified F&O trading dates, comma-separated YYYY-MM-DD"
        required: true
        type: string
        default: "2026-10-21,2026-10-22,2026-10-23,2026-10-26,2026-10-27,2026-10-28,2026-10-29,2026-10-30,2026-11-02,2026-11-03,2026-11-04,2026-11-05,2026-11-06,2026-11-08,2026-11-09,2026-11-11,2026-11-12,2026-11-13,2026-11-16,2026-11-17,2026-11-18,2026-11-19"

permissions:
  contents: read

jobs:
  download:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[nse-download-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/nifty-seller-intelligence-foundation
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the optional downloader dependency
        run: python -m pip install -e ".[download]"
      - name: Download and structurally validate official EOD reports
        env:
          SESSION_DATES: ${{ inputs.session_dates || '2026-10-21,2026-10-22,2026-10-23,2026-10-26,2026-10-27,2026-10-28,2026-10-29,2026-10-30,2026-11-02,2026-11-03,2026-11-04,2026-11-05,2026-11-06,2026-11-08,2026-11-09,2026-11-11,2026-11-12,2026-11-13,2026-11-16,2026-11-17,2026-11-18,2026-11-19' }}
        run: python scripts/download_nse_eod_reports.py --output-dir artifacts/nse-eod
      - name: Upload reports and manifest as a temporary artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nse-eod-reports-${{ github.run_number }}
          path: artifacts/nse-eod/
          if-no-files-found: error
          retention-days: 1
